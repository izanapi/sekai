<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界ガチャ</title><style>
:root{--bg:#0c0d0c;--fg:#d8d9d2;--dim:#7d8077;--line:#30332e;--panel:#111310;--n:#c5c7c1;--r:#6ca8ff;--sr:#e5c95a;--ssr:#b07cff;--ur:#ff9a3d;--x:#ef5a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,"Noto Sans Mono CJK JP",monospace}main{max-width:800px;margin:auto;padding:18px 14px 70px}header{border-bottom:1px solid var(--line);padding-bottom:13px}.eyebrow{font-size:10px;color:var(--dim);letter-spacing:.13em}.title{font-size:26px;margin:7px 0 3px}.stats{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--dim)}b{color:var(--fg);font-weight:500}.panel{background:var(--panel);border:1px solid var(--line);padding:14px;margin:12px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0 8px}.tab,.ghost,.action,.machine button,.skill,.claim{font:inherit;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 10px;cursor:pointer}.tab.on{background:var(--fg);color:var(--bg)}.view{display:none}.view.on{display:block}.machines{display:grid;gap:9px}.machine{border:1px solid var(--line);padding:13px;background:#10120f}.machine.lock{opacity:.46}.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mname{font-size:14px}.mmeta{font-size:10px;color:var(--dim);text-align:right}.mdesc{font-size:11px;color:#a2a59d;line-height:1.65;margin:8px 0 12px}.machine button{width:100%;padding:10px}.machine button:disabled{cursor:default;opacity:.5}.result{display:none;min-height:190px}.result.on{display:block}.rarity{font-size:10px;letter-spacing:.13em}.itemname{font-size:25px;margin:7px 0}.type{font-size:10px;color:var(--dim)}.desc{font-size:13px;line-height:1.85;white-space:pre-line;margin:15px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.action.sell{margin-left:auto}.row{padding:10px 0;border-bottom:1px dotted #292c27;font-size:11px;line-height:1.65}.dim{color:var(--dim)}.invtitle{font-size:13px}.money{color:#d8c071}.quest{border-left:2px solid #555a50;padding-left:11px}.quest.done{border-left-color:#9aa891}.progress{font-size:10px;color:var(--dim);margin-top:5px}.bar{height:4px;background:#22251f;margin:7px 0}.bar i{height:100%;background:#bfc2b7;display:block}.skillgrid{display:grid;gap:7px}.skill{text-align:left;width:100%}.skill:disabled{opacity:.35}.skill strong{display:block;font-size:12px;margin-bottom:3px}.skill span{font-size:10px;color:var(--dim)}.income{display:flex;justify-content:space-between;gap:12px}.notice{font-size:11px;color:#afb2aa;line-height:1.7}.rare-N{color:var(--n)}.rare-R{color:var(--r)}.rare-SR{color:var(--sr)}.rare-SSR{color:var(--ssr)}.rare-UR{color:var(--ur)}.rare-X{color:var(--x)}footer{position:fixed;left:8px;bottom:6px;font-size:9px;color:#464942;background:var(--bg);padding:2px 4px}@media(max-width:520px){.itemname{font-size:22px}.action.sell{margin-left:0}.stats{gap:8px 13px}}</style></head><body><main>
<header><div class="eyebrow">UNIVERSAL ACQUISITION TERMINAL // BUILD 0.3</div><div class="title">世界ガチャ</div><div class="eyebrow">SEKAI GACHA</div><div class="stats"><span>所持金 <b id="money">650</b>円</span><span>発見 <b id="found">0</b></span><span>LV <b id="lv">1</b></span><span>観測収入 <b id="rate">0</b>円/分</span><span>整合率 <b id="integrity">100.000</b>%</span></div></header>
<div class="tabs"><button class="tab on" data-view="gacha">ガチャ</button><button class="tab" data-view="inventory">収集品</button><button class="tab" data-view="quests">依頼</button><button class="tab" data-view="skills">技能</button><button class="tab" data-view="log">記録</button></div>
<section id="gacha" class="view on"><div class="panel notice">端末は対象を価値ではなく存在階層で分類しています。上位端末ほど、物品ではないものを排出します。</div><div id="machines" class="machines"></div><div id="result" class="panel result"><div id="rarity" class="rarity"></div><div id="itemname" class="itemname"></div><div id="type" class="type"></div><div id="desc" class="desc"></div><div class="actions"><button id="keep" class="action">保管</button><button id="use" class="action">使用</button><button id="return" class="action">返却</button><button id="sell" class="action sell">売却 <span id="sellprice"></span>円</button></div></div></section>
<section id="inventory" class="view"><div class="panel"><div class="income"><span>保管庫</span><span class="money" id="incomeText"></span></div><div id="inv"></div></div></section>
<section id="quests" class="view"><div class="panel"><div class="notice">調査局は収集品そのものではなく、カタログ情報を買い取ります。納品しても所有物は失われません。</div><div id="questList"></div></div></section>
<section id="skills" class="view"><div id="skillList"></div></section>
<section id="log" class="view"><div class="panel" id="logs"></div></section>
<footer>世界ガチャ // NOTHING IS OUTSIDE THE POOL</footer>
<script>
const rareClass=r=>'rare-'+(r==='???'?'X':r);const values={N:18,R:45,SR:110,SSR:260,UR:650,'???':1800};const obs={N:.2,R:.6,SR:1.5,SSR:4,UR:10,'???':25};
const I=(n,r,c,t,d,u,x=0)=>({n,r,c,t,d,u,x});
const items=[
I('石','N','物品','鉱物','花崗岩質の小石。質量186g。河川による摩耗が見られる。\n特筆すべき履歴は確認されていない。','床に置いた。石は床に置かれた状態になった。'),
I('釘','N','物品','金属','鉄製。長さ38mm。軸に約5度の湾曲がある。\n再使用は可能だが、端末は推奨していない。','湾曲を修正した。2度まで改善した。'),
I('輪ゴム','N','物品','雑貨','天然ゴム製。直径約54mm。表面に軽度の白化がある。\n長期間、机の引き出しに保管されていた。','伸張試験を実施した。破断しなかった。'),
I('電池','N','物品','電気','単三形アルカリ乾電池。残容量37%。\n二本組で販売された記録がある。もう一本は現在所在不明。','小型時計へ接続した。正常に作動した。'),
I('傘','N','物品','道具','透明なビニール傘。骨一本に変形。\n過去に駅で一度、別の利用者によって持ち去られている。','展開した。現在、降水はない。'),
I('ネギ','N','食品','植物','長ネギの切片。長さ7.2cm。表面は乾燥している。\n切断日は記録されていない。','可食性検査を要求した。端末は責任範囲外と回答した。'),
I('レシート','N','物品','記録','感熱紙。水濡れにより大部分が判読不能。合計額1,284円。\n品目欄には「豆腐」のみ残っている。','乾燥処理を行った。追加情報は復元されなかった。'),
I('鍵','R','物品','道具','一般的な住宅用の鍵。対応する錠前は不明。\n既知の建造物のいずれか一箇所を開ける可能性がある。','周辺の錠前を検査した。一致なし。'),
I('軍手','R','物品','衣類','左手用の作業手袋。2007年2月、青森県内の路肩で回収された。\n右手用は見つかっていない。','装着した。サイズはやや小さい。'),
I('椅子','R','物品','家具','1984年製。2011年廃棄。保管記録上、着座履歴は0件。\n機能上の欠陥は確認されていない。','着座した。履歴が1件に更新された。'),
I('電柱','R','場所','構造物','コンクリート製。2018年から2024年まで、近隣の柴犬による定期的な調査を受けた。\n人間向けの調査結果は存在しない。','設置した。遠方で犬の鳴き声が一度記録された。',.01),
I('硬貨','R','物品','通貨','日本円の10円硬貨。通常流通品。\n額面以上の価値は確認されていない。','所持金へ加算しようとした。会計規則により拒否された。'),
I('猫','R','生物','動物','イエネコ。推定4歳。健康状態は良好。\n排出直前まで、知らない家の窓辺で睡眠していた。','猫は端末を嗅いだ後、関心を失った。',.02),
I('蛾','R','生物','昆虫','ヤガ科と思われる成虫。翅長17mm。\n採取地点の記録は欠落している。','照明へ向かった。端末操作には関与しなかった。'),
I('井戸','SR','場所','設備','石組みの井戸。深度11.4m。現在は使用されていない。\n底部から水音がするが、水面は確認できない。','内部を照明した。光は底部まで到達しなかった。',.08),
I('駅','SR','場所','交通','二面二線の小規模駅。既知の鉄道路線との接続なし。\n時刻表は存在するが、全列車が遅延扱いになっている。','接近放送が流れた。列車は到着しなかった。',.2),
I('島','SR','場所','地形','面積0.74平方kmの無人島。地図記号は存在するが、一般向け地図には掲載されていない。\n淡水源が一箇所ある。','位置情報を要求した。座標欄は空白だった。',.15),
I('昆虫','SR','生物','未記載','既知の分類記録に一致しない六脚類。体長11mm。\n排出時点で未発見という状態は失われた可能性がある。','解放した。分類上の問題は未解決。',.1),
I('骨','SR','物品','生体由来','大型哺乳類の長骨片。年代測定結果は不安定。\nデータベース上、所有者欄は空白。','再検査した。結果は前回と一致しなかった。',.12),
I('雨','SR','現象','気象','大気中の水が液体として落下する現象。\n今回の排出物は水ではなく、降雨という事象そのもの。','局所的な降雨を発生させた。端末周辺だけが濡れた。',.3),
I('記憶','SR','情報','精神','2009年春頃の記憶断片。校舎、濡れた上履き、焼きそばパンを含む。\n所有者は不明。あなたではない。','再生した。知らない校歌の一部を思い出した。',.4),
I('昨日','SSR','時間','過去','現在日の直前に存在した24時間。内容は観測者に依存する。\n使用済み時間として登録されている。','再生した。現在時刻との競合が検出された。',1.6),
I('火曜日','SSR','時間','曜日','月曜日と水曜日の間に配置される曜日。通常は週に一度発生する。\n曜日単体の所有例は確認されていない。','今週へ追加した。暦システムが警告を出した。',1.2),
I('沈黙','SSR','状態','音響','意味のある音が存在しない状態。完全な無音とは異なる。\n容器を振っても音響反応はない。','適用した。周辺音が4.8秒停止した。',.8),
I('赤','SSR','概念','色','可視光の長波長側に対応する色概念。物理波長とは別項目として登録されている。\n文化的属性を多数含む。','適用した。複数の警告表示が意味を失った。',1),
I('距離','SSR','概念','測定','二点間の隔たりを示す量、および関連する抽象概念。\n現在も多くのシステムが依存している。','短縮した。対象となる二点を指定しなかった。',2.8),
I('ジャズ','SSR','概念','音楽','20世紀初頭の米国で形成された音楽文化と、その派生様式。\n分類器は単一の定義を生成できなかった。','適用した。記録時刻がわずかに後方へ移動した。',.9),
I('夢','SSR','現象','精神','睡眠中に発生する主観的経験。今回の個体には複数人分の断片が混在する。\n起床後の保持率は低い。','再生した。内容の41%を直後に忘れた。',1.3),
I('摩擦','UR','法則','物理','接触する物体間の相対運動を妨げる相互作用。歩行、制動、筆記などに関与する。\n長期保管は推奨されていない。','係数を一時変更した。複数地域で軽微な転倒が報告された。',7),
I('重力','UR','法則','物理','質量およびエネルギーに関係する基本相互作用。宇宙構造に広範な依存関係を持つ。\n取り扱い権限は暫定。','局所値を変更した。多数の監視系が警告を出した。',11),
I('因果','UR','法則','論理','事象間の原因と結果を関連付ける構造。現在のゲーム進行も依存している。\n変更操作は未検証。','順序を変更した。結果が原因より0.2秒先に記録された。',13),
I('死','UR','概念','生物','生命活動の不可逆的な停止、および関連概念。起源年代は特定不能。\n削除権限は付与されていない。','使用要求は拒否された。依存関係が多すぎる。',0),
I('月','UR','天体','衛星','地球の自然衛星。平均直径約3,474km。\n実体を取得したのか参照権のみか、端末仕様書には記載がない。','使用要求は潮汐管理系によって拒否された。',4),
I('時間','UR','法則','時間','事象の順序と持続を扱う基礎的な構造。\n端末内部時計を含む多数の機能が依存している。','停止要求を送信した。端末時計だけが0.3秒遅れた。',14),
I('世界','???','全体','総体','現在アクセス可能な存在、事象、規則、情報の総体。\n取得処理完了後に外部が残るかどうかは定義されていない。','取得を開始した。0.7%で安全装置が作動した。',28)
];
const machines=[
{name:'拾得物ガチャ',cost:100,unlock:0,desc:'日用品、食品、雑貨。世界の表面に落ちているもの。',cats:['物品','食品'],weights:{N:66,R:27,SR:7,SSR:0,UR:0,'???':0}},
{name:'現地調査ガチャ',cost:350,unlock:1200,desc:'場所、生物、現象を含む。調査局の通常装備。',cats:['物品','場所','生物','現象'],weights:{N:25,R:40,SR:27,SSR:8,UR:0,'???':0}},
{name:'記録保管庫ガチャ',cost:900,unlock:3500,desc:'記憶、時間、状態、概念。物質でない項目が混入する。',cats:['情報','時間','状態','概念','現象'],weights:{N:0,R:9,SR:41,SSR:42,UR:8,'???':0}},
{name:'基底構造ガチャ',cost:2500,unlock:9000,desc:'法則、天体、総体。端末は利用を推奨していない。',cats:['法則','概念','天体','時間','全体'],weights:{N:0,R:0,SR:8,SSR:37,UR:52,'???':3}}
];
let S={money:650,integrity:100,seen:{},bag:{},earned:0,spent:0,pulls:0,quests:[],questSerial:0};const $=id=>document.getElementById(id);
function level(){return 1+Math.floor(Object.keys(S.seen).length/6)}function itemByName(n){return items.find(x=>x.n===n)}function log(s){let e=document.createElement('div');e.className='row';e.innerHTML='<span class="dim">['+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+']</span> '+s;$('logs').prepend(e)}function addMoney(n,why){S.money+=n;S.earned+=n;if(why)log(why+' +'+n+'円')}function spend(n){S.money-=n;S.spent+=n}
function incomeRate(){let z=0;for(const [n,q] of Object.entries(S.bag)){let it=itemByName(n);if(it)z+=obs[it.r]*q}return Math.round(z*10)/10}
function pick(m){let pool=items.filter(x=>m.cats.includes(x.c));let total=pool.reduce((a,x)=>a+(m.weights[x.r]||0),0),r=Math.random()*total;for(const x of pool){r-=m.weights[x.r]||0;if(r<=0)return x}return pool[0]}
function unlocked(m){return S.earned>=m.unlock}
function renderMachines(){ $('machines').innerHTML=machines.map((m,i)=>{let ok=unlocked(m),need=Math.max(0,m.unlock-S.earned);return `<div class="machine ${ok?'':'lock'}"><div class="mhead"><div class="mname">${m.name}</div><div class="mmeta">${m.cost}円 / ${ok?'利用可能':'累計収入 '+m.unlock+'円で解禁'}</div></div><div class="mdesc">${m.desc}${ok?'':`<br>あと ${need}円 の収入が必要。`}</div><button data-machine="${i}" ${(!ok||S.money<m.cost)?'disabled':''}>${ok?'抽選する':'LOCKED'}</button></div>`}).join('');document.querySelectorAll('[data-machine]').forEach(b=>b.onclick=()=>pull(+b.dataset.machine))}
function rarityText(it){return `<span class="${rareClass(it.r)}">${it.r} // ${it.c}</span>`}let current=null;
function pull(i){let m=machines[i];if(!unlocked(m)||S.money<m.cost)return;spend(m.cost);S.pulls++;current=pick(m);let fresh=!S.seen[current.n];S.seen[current.n]=(S.seen[current.n]||0)+1;$('rarity').className='rarity '+rareClass(current.r);$('rarity').textContent=current.r+' // '+current.c+(fresh?' // NEW':'');$('itemname').className='itemname '+rareClass(current.r);$('itemname').textContent=current.n;$('type').textContent=current.t;$('desc').textContent=current.d;$('sellprice').textContent=values[current.r];$('result').classList.add('on');log(m.name+'：'+current.n+' ['+current.r+']'+(fresh?' を新規登録。':''));checkQuests();render()}
function finishCurrent(){current=null;$('result').classList.remove('on')}
$('keep').onclick=()=>{if(!current)return;S.bag[current.n]=(S.bag[current.n]||0)+1;log(current.n+'を保管庫へ移動。');finishCurrent();render()};$('sell').onclick=()=>{if(!current)return;let p=values[current.r];addMoney(p,current.n+'を売却。');finishCurrent();render()};$('return').onclick=()=>{if(!current)return;log(current.n+'を世界へ返却。');finishCurrent();render()};$('use').onclick=()=>{if(!current)return;log(current.u);S.integrity-=current.x;finishCurrent();render()};
function renderInv(){let entries=Object.entries(S.bag).filter(x=>x[1]>0);$('incomeText').textContent='観測 '+incomeRate()+'円/分';$('inv').innerHTML=entries.length?entries.map(([n,q])=>{let x=itemByName(n);return `<div class="row"><div class="invtitle ${rareClass(x.r)}">${x.n} ×${q}</div><span class="dim">${x.r} / ${x.c} / 観測 ${obs[x.r]}円/分</span><br>${x.d}<br><button class="ghost" data-sellbag="${x.n}">1個売却 ${values[x.r]}円</button></div>`}).join(''):'<div class="row dim">保管庫は空です。保管した項目は毎分、観測収入を発生させます。</div>';document.querySelectorAll('[data-sellbag]').forEach(b=>b.onclick=()=>{let n=b.dataset.sellbag,x=itemByName(n);if(S.bag[n]>0){S.bag[n]--;addMoney(values[x.r],n+'を保管庫から売却。');render()}})}
const questTemplates=[
{txt:'物品を3種類登録',goal:3,reward:220,test:()=>items.filter(x=>x.c==='物品'&&S.seen[x.n]).length},
{txt:'生物を2種類登録',goal:2,reward:420,test:()=>items.filter(x=>x.c==='生物'&&S.seen[x.n]).length},
{txt:'場所を2種類登録',goal:2,reward:500,test:()=>items.filter(x=>x.c==='場所'&&S.seen[x.n]).length},
{txt:'SR以上を4種類登録',goal:4,reward:650,test:()=>items.filter(x=>['SR','SSR','UR','???'].includes(x.r)&&S.seen[x.n]).length},
{txt:'SSR以上を2種類登録',goal:2,reward:900,test:()=>items.filter(x=>['SSR','UR','???'].includes(x.r)&&S.seen[x.n]).length},
{txt:'10種類登録',goal:10,reward:600,test:()=>Object.keys(S.seen).length},
{txt:'20種類登録',goal:20,reward:1600,test:()=>Object.keys(S.seen).length}
];
function ensureQuests(){while(S.quests.length<3){let t=questTemplates[Math.floor(Math.random()*questTemplates.length)];if(S.quests.some(q=>q.txt===t.txt))continue;S.quests.push({id:++S.questSerial,txt:t.txt,goal:t.goal,reward:t.reward,done:false,claimed:false})}}
function questProgress(q){let t=questTemplates.find(x=>x.txt===q.txt);return Math.min(q.goal,t.test())}function checkQuests(){for(const q of S.quests)if(!q.claimed&&questProgress(q)>=q.goal)q.done=true}
function renderQuests(){ensureQuests();checkQuests();$('questList').innerHTML=S.quests.map(q=>{let p=questProgress(q);return `<div class="row quest ${q.done?'done':''}"><b>${q.txt}</b><div class="progress">${p} / ${q.goal}　報酬 ${q.reward}円</div>${q.done&&!q.claimed?`<button class="claim" data-claim="${q.id}">報酬を受け取る</button>`:''}</div>`}).join('');document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{let q=S.quests.find(x=>x.id==b.dataset.claim);if(q&&q.done&&!q.claimed){q.claimed=true;addMoney(q.reward,'調査依頼完了。');S.quests=S.quests.filter(x=>!x.claimed);ensureQuests();render()}})}
const skills=[['再鑑定',6,'売却価格が10%上がる予定。現在は予備登録。'],['観測強化',12,'観測収入が増える予定。現在は予備登録。'],['優先照会',18,'上位レアの重みを調整する予定。現在は予備登録。'],['保管拡張',24,'複数運用機能を解禁する予定。現在は予備登録。']];
function renderSkills(){let n=Object.keys(S.seen).length,lv=level(),next=lv*6;$('skillList').innerHTML=`<div class="panel"><b>収集レベル ${lv}</b><div class="bar"><i style="width:${((n%6)/6)*100}%"></i></div><span class="dim">次のレベルまで ${next-n} 種類</span></div><div class="skillgrid">${skills.map(s=>`<button class="skill" ${n<s[1]?'disabled':''}><strong>${s[0]} [${s[1]}種]</strong><span>${s[2]} ${n<s[1]?'// 未解禁':'// 解禁済み'}</span></button>`).join('')}</div>`}
function render(){let n=Object.keys(S.seen).length;$('money').textContent=Math.floor(S.money).toLocaleString();$('found').textContent=n;$('lv').textContent=level();$('rate').textContent=incomeRate();$('integrity').textContent=Math.max(0,S.integrity).toFixed(3);renderMachines();renderInv();renderQuests();renderSkills()}
setInterval(()=>{let r=incomeRate();if(r>0){S.money+=r/12;S.earned+=r/12;render()}},5000);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.view).classList.add('on');render()});
ensureQuests();log('端末起動。拾得物ガチャが利用可能。');log('調査局から初期運用資金650円を受領。');render();
</script></body></html>
