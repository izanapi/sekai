<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界ガチャ</title><style>:root{--b:#0b0c0b;--f:#d8d8cf;--d:#777970;--l:#34362f;--a:#c8b982}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--f);font-family:ui-monospace,SFMono-Regular,Menlo,"Noto Sans Mono CJK JP",monospace}main{max-width:760px;margin:auto;padding:20px 16px 70px}header{border-bottom:1px solid var(--l);padding-bottom:14px}.k{font-size:10px;color:var(--d);letter-spacing:.13em}.title{font-size:25px;margin:7px 0}.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--d)}b{color:var(--f);font-weight:500}.panel{border:1px solid var(--l);padding:14px;margin:12px 0}.machine{text-align:center;padding:25px 12px}.machine p{font-size:12px;color:var(--d);min-height:18px}.pull{font:inherit;border:0;background:var(--f);color:var(--b);padding:13px 25px;cursor:pointer}.pull:disabled{opacity:.3}.result{display:none}.result.on{display:block}.rare{font-size:10px;color:var(--a);letter-spacing:.15em}.name{font-size:23px;margin:8px 0}.type{font-size:10px;color:var(--d)}.desc{font-size:13px;line-height:1.8;white-space:pre-line;margin:14px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.tab,.skill{font:inherit;background:none;color:var(--f);border:1px solid var(--l);padding:8px 10px;cursor:pointer;font-size:11px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:17px 0 8px}.tab.on{background:var(--f);color:var(--b)}.view{display:none}.view.on{display:block}.row{padding:9px 0;border-bottom:1px dotted #292b26;font-size:11px;line-height:1.6}.dim{color:var(--d)}.skillbox{display:grid;gap:8px}.skill{display:block;text-align:left;width:100%}.skill:disabled{opacity:.35}.skill strong{display:block;font-size:12px;margin-bottom:3px}.skill span{color:var(--d);font-size:10px}.level{font-size:12px;line-height:1.7}.bar{height:4px;background:#22241f;margin:8px 0}.bar i{display:block;height:100%;background:var(--f)}footer{position:fixed;bottom:6px;left:9px;color:#454740;font-size:9px}</style></head><body><main><header><div class="k">UNIVERSAL ACQUISITION TERMINAL // CATALOGUE BUILD 0.2</div><div class="title">世界ガチャ</div><div class="k">SEKAI GACHA</div><div class="stats"><span>所持金 <b id="money">1000</b>円</span><span>収集 <b id="count">0</b></span><span>LV <b id="lv">1</b></span><span>整合率 <b id="int">100.000</b>%</span></div></header><section class="panel machine"><p id="msg">排出対象データベースに接続しました。対象件数：算出不能。</p><button class="pull" id="pull">抽選する　100円</button></section><section class="panel result" id="result"><div class="rare" id="rare"></div><div class="name" id="name"></div><div class="type" id="type"></div><div class="desc" id="desc"></div><div class="actions"><button id="keep">回収</button><button id="use">使用</button><button id="back">返却</button></div></section><div class="tabs"><button class="tab on" data-v="log">記録</button><button class="tab" data-v="inv">収集品</button><button class="tab" data-v="skills">技能</button><button class="tab" data-v="world">世界</button></div><section class="view on" id="log"></section><section class="view" id="inv"></section><section class="view" id="skills"></section><section class="view" id="world"><div class="panel level" id="worldtxt">現在、既知の世界構造に重大な欠損はありません。</div></section><footer>世界ガチャ // ALL EXISTING THINGS ARE ELIGIBLE</footer></main><script>
const I=(n,r,t,d,u,x=0)=>({n,r,t,d,u,x});const items=[
I('輪ゴム','N','物品 / 雑貨','天然ゴム製の輪。直径約54mm。長期間引き出しに保管されていたため、表面に軽度の劣化がある。\n本来の所有者は特定されていない。','輪ゴムを伸ばした。異常なし。'),I('湿ったレシート','N','物品 / 記録','感熱紙製の購入記録。水濡れにより品目の大部分が判読不能。合計金額は1,284円。\n「豆腐」の文字だけが比較的良好な状態で残っている。','乾燥させた。情報の復元には失敗した。'),I('単三電池 一本','N','物品 / 電気','アルカリ乾電池。残容量は不明。二本組で販売されたものの片方と推定される。\nもう一本の所在は記録されていない。','電圧を測定した。まだ少し使える。'),I('10円玉','N','物品 / 通貨','日本国で流通している青銅貨。製造年には軽い摩耗があり判読しづらい。\n額面以上の特別な価値は確認されていない。','10円を所持金へ移した。'),I('ビニール傘','N','物品 / 道具','透明なポリエチレン製の傘。骨一本がわずかに曲がっている。\n駅前で一度、別人の傘と取り違えられた履歴がある。','傘を開いた。屋内なので役には立たなかった。'),I('冷蔵庫の奥のネギ','N','食品 / 植物','長さ7.2cmの長ネギ片。切断日は不明。表面は乾燥している。\n可食性について端末は保証しない。','廃棄区分を確認した。端末は回答しなかった。'),I('少し曲がった釘','N','物品 / 金属','鉄製の釘。軸が約6度湾曲している。再使用は可能だが推奨されない。\n曲がった理由は重要ではない。','釘をまっすぐにしようとした。約4度まで改善した。'),I('知らない家の鍵','R','物品 / 鍵','一般的なディスクシリンダー錠用の鍵。対応する錠前は不明。\n地球上のどこか一箇所を開けられる可能性が高い。','近くに対応する錠前はなかった。'),I('犬が調査していた電柱','R','構造物 / 都市設備','一般的なコンクリート製電柱。2018年から2024年まで、近隣の柴犬による定期的な調査を受けていた。\n人間向けの有用な調査結果は残っていない。','電柱を配置した。遠方で犬が一度吠えた。',.002),I('誰も座らなかった椅子','R','物品 / 家具','1984年製の木製椅子。2011年に廃棄されるまで、着座の記録が一件もない。\n製品としては正常だった。','着座した。履歴が一件追加された。',.01),I('2007年に落とされた左手用軍手','SR','物品 / 衣類','2007年2月、青森県内の路肩で紛失された作業用軍手。左手用。\n右手用は現在も排出対象データベース内で所在不明。','装着した。サイズは少し小さい。'),I('知らない人の高校時代の記憶','SR','情報 / 記憶','2009年春頃の記憶断片。雨天の校舎、濡れた上履き、購買部の焼きそばパンを含む。\n記憶の所有者は不明。あなたではない。','再生した。知らない校歌の一部を思い出した。',.03),I('閉店した店のポイントカード','R','物品 / 記録','飲食店のポイントカード。8個の押印がある。10個で一品無料になる規定だった。\n店舗は2016年に閉店している。','使用先を検索した。0件。'),I('名前を忘れた同級生','SR','人物 / 記憶','かつてあなたと同じ教室にいた人物に関する参照情報。顔と名前の対応が失われている。\n相手もあなたを覚えていない可能性がある。','参照を試みた。顔だけが浮かび、すぐ消えた。',.04),I('雨','SR','現象 / 気象','大気中の水蒸気が凝結し、液体の水として地表へ落下する現象。\n今回の排出物は水そのものではなく「降雨」という事象である。','局所的な雨を発生させた。端末周辺のみ濡れた。',.3),I('午前3時17分','SR','時間 / 時刻','一日のうち3時17分00秒から3時17分59秒までを示す時間区分。\n特定の日付には所属していない。','時刻を適用した。時計類が一分間だけ同期を失った。',.4),I('火曜日','SSR','時間 / 曜日','月曜日と水曜日の間に配置される曜日。通常、一週間につき一回発生する。\n曜日単体の所有について前例は確認されていない。','今週へ火曜日を一日追加した。カレンダーに不整合が発生した。',1.2),I('昨日','SSR','時間 / 過去','現在日の直前に存在した24時間。内容は取得時点の観測者に依存する。\n使用済みの時間である。','昨日を再生した。現在時刻との競合が検出された。',2),I('存在しない駅','SSR','場所 / 未確認','鉄道駅としての構造と情報を持つが、既知の鉄道路線には接続されていない。ホームは2面。出口は3箇所。\n時刻表には次の列車が「遅延」とだけ記載されている。','駅を配置した。接近放送が流れたが列車は到着しなかった。',.9),I('まだ発見されていない昆虫','SSR','生物 / 未記載','既存の分類記録に一致しない小型昆虫。体長11mm。六脚。\n排出時点で「未発見」という属性が失われた可能性がある。','昆虫を解放した。分類上の問題は解決していない。',.3),I('ジャズ','SSR','概念 / 音楽','20世紀初頭の米国で形成された音楽文化、およびそこから派生した多数の様式の総称。\n端末の分類器は定義を完了できなかった。','適用した。記録時刻がわずかに後ろへずれた。',.7),I('赤','SSR','概念 / 色','可視光の長波長側に対応する色概念。文化的、言語的な追加属性を多数含む。\n物理波長そのものとは別の項目として登録されている。','赤を適用した。いくつかの警告表示が意味を失った。',1.1),I('距離','SSR','概念 / 測定','二点間の隔たりを表す量または概念。空間、数学、比喩表現で使用される。\n収納時も対象間の距離は維持されている。','距離を短縮した。どの二点かは指定しなかった。',3),I('沈黙','SR','状態 / 音響','意味のある音が存在しない、または発話が行われない状態。完全な無音とは異なる。\n容器を振っても音はしない。','沈黙を使用した。4.8秒間、周囲の環境音が停止した。',.5),I('あなたがゲームを起動した瞬間','UR','出来事 / 履歴','現在のセッション開始時に発生した出来事の完全な記録。\nこの項目を閲覧している行為は記録内容には含まれていない。','出来事を再生した。端末が一度だけ再起動音を鳴らした。',1.5),I('摩擦','UR','物理 / 相互作用','接触する物体間の相対運動を妨げる力。歩行、制動、筆記など多数の活動に関与する。\n取り扱いには物理学上の注意が必要。','摩擦係数を一時的に変更した。複数地域で軽微な転倒が報告された。',8),I('重力','UR','物理 / 基本相互作用','質量およびエネルギーに関係する基本的な相互作用。現在の宇宙構造に広範な影響を持つ。\n端末は長期保管を推奨していない。','局所重力を変更した。世界整合性検査に多数の警告が出た。',12),I('死','UR','概念 / 生物','生命活動の不可逆的な停止、およびそれに関連する概念群。\n項目の起源年代は特定不能。削除権限は付与されていない。','使用要求は拒否された。理由：依存関係が多すぎます。'),I('因果関係','UR','概念 / 論理','ある事象を別の事象の原因または結果として関連付ける構造。\n現在のゲーム進行も複数箇所でこの項目に依存している。','変更要求を送信した。処理順序が一時的に逆転した。',14),I('月','UR','天体 / 衛星','地球の唯一の恒常的な自然衛星。平均直径約3,474km。\n実物を収納しているのか参照権だけを取得したのか、端末仕様書には記載がない。','月を使用しようとした。潮汐管理システムから拒否された。',5),I('ガチャ','UR','装置 / 再帰','無作為な項目を排出する装置。現在使用中の端末と機能上ほぼ同一。\n内部に同型端末が一台含まれている。','内部端末で抽選を実行した。結果：空。',2),I('このゲーム','★★★★★','ソフトウェア / 自己参照','現在実行中の「世界ガチャ」。バージョン情報と現在のセッション状態を含む。\n実行中の対象を収集品として扱う動作は未検証。','自己参照を実行した。タイトル表示が0.4秒間消失した。',10),I('世界のすべて','????????','全体 / 未分類','排出対象データベースに登録されている全項目、および未登録項目を含む集合。\n取得処理を完了した場合、外部世界に何が残るかは定義されていない。','取得処理を開始した。0.7%で安全装置が作動し、中止された。',30)];
const W={N:48,R:25,SR:14,SSR:8,UR:3,'★★★★★':1.5,'????????':.5};let money=1000,intg=100,bag=[],seen=new Set(),cur=null,pulls=0,luck=0,discount=0;const $=x=>document.getElementById(x);const level=()=>1+Math.floor(seen.size/5);function addlog(s){let e=document.createElement('div');e.className='row';e.innerHTML='<span class="dim">['+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+']</span> '+s;$('log').prepend(e)}function choose(){let a=items.map(i=>[i,(W[i.r]||1)*(luck&&['SSR','UR','★★★★★','????????'].includes(i.r)?1+luck:1)]);if(pulls<15)a.find(x=>x[0].r==='????????')[1]=0;let z=a.reduce((s,x)=>s+x[1],0),r=Math.random()*z;for(let x of a)if((r-=x[1])<=0)return x[0];return items[0]}
const skills=[{n:'再抽選',at:5,txt:'現在の排出物を一度だけ無料で抽選し直す。',go(){show(choose());addlog('技能「再抽選」を実行。')}},{n:'回収業者',at:10,txt:'回収するたび25円を得る。常時効果。'},{n:'鑑定眼',at:15,txt:'SR以上の排出率が上昇する。常時効果。'},{n:'一括取得許可',at:25,txt:'抽選価格が80円になる。常時効果。'},{n:'世界照会',at:30,txt:'世界について内部記録を一件照会する。',go(){let q=['海底には所有者欄が空白の物品が大量に存在する。','「未来」は排出対象に含まれるが、現在アクセス権がない。','人間の記憶は物品として扱われている。異議申立ては受理されていない。','データベースには「まだ起きていない事故」という分類が存在する。'];addlog('世界照会：'+q[Math.floor(Math.random()*q.length)])}}];
function renderSkills(){let lv=level(),next=lv*5,prev=(lv-1)*5,p=(seen.size-prev)/5*100;$('skills').innerHTML='<div class="panel level">収集レベル <b>'+lv+'</b><div class="bar"><i style="width:'+p+'%"></i></div>次のレベルまで '+(next-seen.size)+' 種類</div><div class="skillbox">'+skills.map((s,i)=>'<button class="skill" data-s="'+i+'" '+(seen.size<s.at?'disabled':'')+'><strong>'+s.n+' ['+s.at+'種]</strong><span>'+s.txt+(seen.size<s.at?' // 未解禁':' // 利用可能')+'</span></button>').join('')+'</div>';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{let s=skills[+b.dataset.s];if(s.go)s.go()})}function render(){if(seen.size>=15)luck=.35;if(seen.size>=25)discount=1;$('money').textContent=money;$('count').textContent=seen.size;$('lv').textContent=level();$('int').textContent=Math.max(0,intg).toFixed(3);$('pull').disabled=money<(discount?80:100);$('pull').textContent='抽選する　'+(discount?80:100)+'円';$('inv').innerHTML=bag.length?bag.map(x=>'<div class="row"><b>'+x.n+'</b> <span class="dim">['+x.r+' / '+x.t+']</span><br>'+x.d+'</div>').join(''):'<div class="row dim">収集品はありません。</div>';renderSkills()}function show(x){cur=x;let fresh=!seen.has(x.n);seen.add(x.n);$('rare').textContent=x.r+(fresh?' // NEW ENTRY':' // DUPLICATE');$('name').textContent=x.n;$('type').textContent=x.t;$('desc').textContent=x.d;$('result').classList.add('on');addlog('排出：['+x.r+'] '+x.n+(fresh?'。カタログへ新規登録。':''));render()}
$('pull').onclick=()=>{let c=discount?80:100;if(money<c)return;money-=c;pulls++;$('result').classList.remove('on');$('msg').textContent=['排出対象を照会中。','所有権を一時移転中。','対象の存在を確認中。','カタログ照合中。'][Math.floor(Math.random()*4)];setTimeout(()=>show(choose()),180)};$('keep').onclick=()=>{if(!cur)return;bag.push(cur);if(seen.size>=10)money+=25;addlog(cur.n+'を回収した。'+(seen.size>=10?' 回収手当：25円。':''));cur=null;$('result').classList.remove('on');render()};$('back').onclick=()=>{if(cur)addlog(cur.n+'を返却した。返却先は記録されていない。');cur=null;$('result').classList.remove('on')};$('use').onclick=()=>{if(!cur)return;addlog(cur.u);intg-=cur.x;$('worldtxt').innerHTML='<b>世界整合率 '+Math.max(0,intg).toFixed(3)+'%</b><br>'+cur.u+'<br><br>'+(intg<80?'警告：複数の基準世界との差異を検出。運用は継続されます。':'既知の許容範囲内です。');cur=null;$('result').classList.remove('on');render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.v).classList.add('on')});addlog('端末起動。排出対象：世界に存在する、または存在し得るすべての項目。');render();</script></body></html>
