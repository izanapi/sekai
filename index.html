<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>EVERYTHING GACHA / この世のすべて</title>
<style>
:root{--bg:#0b0b0a;--fg:#deddd3;--dim:#77766e;--line:#34332e;--hot:#f1eee0;--warn:#b8aa7c}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Noto Sans Mono CJK JP",monospace;min-height:100%}
body{display:flex;justify-content:center}.app{width:min(760px,100%);min-height:100vh;padding:22px 18px 60px}
header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.tiny{font-size:11px;color:var(--dim);letter-spacing:.14em}.title{font-size:21px;letter-spacing:.08em;margin:7px 0 2px}.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}.stats b{color:var(--fg);font-weight:500}
.panel{border:1px solid var(--line);padding:14px;margin:12px 0}.machine{text-align:center;padding:23px 12px}.machine .slot{font-size:12px;color:var(--dim);margin-bottom:18px}.machine button{font:inherit;color:var(--bg);background:var(--hot);border:0;padding:13px 28px;cursor:pointer;letter-spacing:.14em}.machine button:active{transform:translateY(1px)}.machine button:disabled{opacity:.3}
.result{min-height:150px;display:none}.result.show{display:block}.rarity{font-size:11px;letter-spacing:.18em;color:var(--warn)}.name{font-size:24px;margin:8px 0 11px}.type{font-size:11px;color:var(--dim);margin-bottom:14px}.flavor{line-height:1.8;font-size:14px;white-space:pre-line}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.actions button,.tab{font:inherit;font-size:11px;background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 10px;cursor:pointer}.actions button:hover,.tab:hover{border-color:var(--fg)}
.tabs{display:flex;gap:7px;margin-top:18px}.tab.active{background:var(--fg);color:var(--bg)}.view{display:none}.view.active{display:block}.log{font-size:12px;line-height:1.65}.log div{padding:6px 0;border-bottom:1px dotted #262520}.log .time{color:var(--dim);margin-right:8px}.inv-item{padding:11px 0;border-bottom:1px solid var(--line)}.inv-head{display:flex;justify-content:space-between;gap:10px}.inv-name{font-size:13px}.inv-meta{font-size:10px;color:var(--dim)}.inv-flavor{font-size:11px;color:#aaa89d;margin-top:5px;line-height:1.5}.empty{color:var(--dim);font-size:12px;padding:18px 0}.world{font-size:12px;line-height:1.8}.world strong{font-weight:500;color:var(--hot)}
footer{position:fixed;bottom:7px;left:10px;font-size:9px;color:#4c4b46;pointer-events:none}.blink{animation:blink .35s steps(2) 3}@keyframes blink{50%{opacity:.15}}@media(max-width:500px){.app{padding:18px 14px 55px}.name{font-size:21px}}
</style>
</head><body><main class="app">
<header><div class="tiny">UNIVERSAL DISTRIBUTION TERMINAL // PROPERTY OF NOBODY</div><div class="title">この世のすべて</div><div class="tiny">EVERYTHING GACHA</div><div class="stats"><span>所持金 <b id="money">1,000</b>円</span><span>発見 <b id="found">0</b> / ∞</span><span>世界整合率 <b id="integrity">100.000</b>%</span></div></header>
<section class="panel machine"><div class="slot" id="machineText">カプセルの中で、何かが世界になるのを待っている。</div><button id="pull">1回引く　100円</button></section>
<section class="panel result" id="result"><div class="rarity" id="rarity"></div><div class="name" id="name"></div><div class="type" id="type"></div><div class="flavor" id="flavor"></div><div class="actions"><button id="keep">保管する</button><button id="use">使用する</button><button id="discard">世界へ戻す</button></div></section>
<div class="tabs"><button class="tab active" data-view="history">排出履歴</button><button class="tab" data-view="inventory">所有物</button><button class="tab" data-view="world">世界</button></div>
<section class="view active" id="history"><div class="log" id="log"><div><span class="time">--:--</span>端末が起動しました。</div><div><span class="time">--:--</span>「この世のすべて」が排出対象に設定されています。</div><div><span class="time">--:--</span>なお、返金には応じません。</div></div></section>
<section class="view" id="inventory"><div id="inv" class="empty">まだ何も所有していない。これはかなり珍しい状態です。</div></section>
<section class="view" id="world"><div class="panel world" id="worldText"><strong>世界は正常です。</strong><br>少なくとも、この端末はそう主張しています。</div></section>
<footer>ver. 0.1.0 // EVERYTHING IS ELIGIBLE</footer>
<script>
const items=[
{n:'輪ゴム',r:'N',t:'物質 / 文房具寄り',f:['机の引き出しに三年間いた。誰もその三年間を必要としていない。','何かを束ねるために作られた。いまは単独である。','少し白くなっている。伸ばすと嫌な予感がする。'],u:'輪ゴムを伸ばした。世界には特に影響がなかった。たぶん。',d:0},
{n:'湿ったレシート',r:'N',t:'物質 / 記録',f:['合計 1,284円。何を買ったのかは、もう読めない。','財布に入れるには湿りすぎている。捨てるには少しだけ情報量が多い。','誰かの昨日が、感熱紙の上でゆっくり消えている。'],u:'レシートを乾かした。「豆腐」という文字だけが残った。',d:0},
{n:'特に意味のない石',r:'N',t:'物質 / 鉱物',f:['意味はない。念のため三回調べた。','約2億年前からここにいるが、これといったエピソードはない。','持つと石の重さがする。非常に石らしい。'],u:'石を置いた。そこが少しだけ「石のある場所」になった。',d:0},
{n:'さっきより少し意味のある石',r:'R',t:'物質 / 鉱物 / 比較',f:['何と比較しているのかは不明。','意味が増えた形跡がある。増加量は測定不能。','見つめていると、こちらが試されている気がして腹が立つ。'],u:'意味を確認しようとした。石は黙秘した。',d:.0001},
{n:'ちょっと短いLANケーブル',r:'N',t:'物質 / 通信',f:['あと27cmあれば全てが丸く収まった。','届かない。それだけで、この物体の人格はほぼ完成している。','通信速度は十分。長さだけが人生に反抗している。'],u:'接続を試みた。あと少しだった。世界整合率が苛立ちで微減した。',d:.001},
{n:'知らない人の高校時代の記憶',r:'SR',t:'記憶 / 私有情報',f:['雨の渡り廊下。購買の焼きそばパン。呼ばれなかったあだ名。','あなたのものではないのに、懐かしい。これが一番困る。','記憶の端に、こちらを見ている人物がいる。その人もあなたを知らない。'],u:'記憶を再生した。三秒だけ、知らない校歌を歌えるようになった。',d:.03},
{n:'犬が気にしていた電柱',r:'R',t:'場所 / 建造物 / 犬的関心',f:['犬はもうここには来ない。電柱は理由を知らない。','人間から見れば電柱。犬から見れば、かなり情報量の多い掲示板。','管理番号はある。物語番号はない。'],u:'電柱を設置した。どこからか犬が一匹、こちらを気にした。',d:.002},
{n:'2007年に青森県で落とされた片方だけの軍手',r:'UR',t:'物質 / 唯一物',f:['もう片方についての記録はない。','世界に一つしかない。だから希少である。価値については聞かないでほしい。','雪解けまで誰にも見つからなかった。それ以降も、だいたい同じだった。'],u:'軍手を装備した。片手だけが2007年の冬になった。',d:.08},
{n:'火曜日',r:'SSR',t:'時間 / 曜日',f:['月曜日の次に置かれていたもの。','世界中のカレンダーから、薄い悲鳴が聞こえる。','所有権という概念が曜日に適用できるか、法務部は回答を拒否した。'],u:'火曜日を使用した。次の火曜日が今日に挿入された。今週は少し長い。',d:1.2},
{n:'雨',r:'SR',t:'現象 / 気象',f:['水滴そのものではなく、「降っている」という状態が封入されている。','開封前からカプセルが少し濡れている。','昔から人は雨を待ったり嫌ったりしてきた。いまはあなたのポケットにある。'],u:'雨を使用した。端末の内側だけで、静かに降り始めた。',d:.4},
{n:'ジャズ',r:'SSR',t:'概念 / 音楽',f:['定義しようとすると排出エラーが起きる。','二拍目と四拍目を所有しようとした者は、まだ帰ってきていない。','カプセルを振ると、毎回違う位置で音がする。'],u:'ジャズを使用した。ログの句読点が少し後ろにずれた。',d:.7},
{n:'昨日',r:'SSR',t:'時間 / 過去',f:['使用済みの一日。返品された形跡がある。','あなたが忘れた部分も含めて、完全な昨日。','賞味期限：今日になるまで。'],u:'昨日を開封した。数秒間だけ、すべてのログ時刻が一日前を指した。',d:2.0},
{n:'誰も座らなかった椅子',r:'SR',t:'物質 / 可能性',f:['1984年製。2011年廃棄。座面には一度も人間の重さが記録されなかった。','椅子としての生涯を、椅子らしい出来事なしに終えた。','座られなかった回数を数えることはできない。'],u:'椅子に座った。歴史が一行だけ訂正された。',d:.05},
{n:'まだ誰にも発見されていない昆虫',r:'SSR',t:'生物 / 未記載種',f:['おめでとう。これで「まだ誰にも発見されていない」ではなくなった。','名前がない。こちらを見ている。分類学者を呼ぶべきかもしれない。','排出された瞬間に説明文が自己矛盾を起こした。'],u:'昆虫を逃がした。図鑑のどこにも載っていない場所へ歩いていった。',d:.3},
{n:'あなたがこのゲームを起動した瞬間',r:'UR',t:'出来事 / 現在史',f:['ついさっきのことなのに、すでに展示品になっている。','このカプセルを開けた時点で、出来事の中に出来事が増えた。','再生すると、この端末がもう一度起動する可能性があります。保証対象外です。'],u:'瞬間を再生した。画面が一度だけ暗転し、「おかえり」と表示された。',d:1.5},
{n:'摩擦',r:'UR',t:'物理 / 相互作用',f:['床、タイヤ、鉛筆、マッチ。かなり多くのものがこれに依存している。','カプセルが異様に滑りやすい。','「使用」と「保管」のどちらが危険なのか、説明書には書かれていない。'],u:'摩擦を使用した。三秒間、世界中の机の上の物が少しずつ滑った。',d:8},
{n:'重力',r:'UR',t:'物理 / 基本現象',f:['質量を持つもの同士が互いを忘れないための仕組み。','非常に重そうな名前だが、カプセル自体は14g。','注意：紛失しないでください。'],u:'重力を一度だけ弱めた。世界中で数億人が「今なんか変じゃなかった？」と思った。',d:12},
{n:'死',r:'UR',t:'概念 / 生物学 / その他',f:['古い。生命より少しだけ新しい。','これを所有している間も、生物は死ぬ。つまり所有とは何なのか。','ゴミ箱アイコンが、さっきから消えている。'],u:'「死」を使用しようとした。端末は17秒沈黙し、処理を拒否した。',d:15},
{n:'存在しない駅',r:'SSR',t:'場所 / 虚構',f:['次の電車は来ない。ただし遅延しています。','出口は三つある。どれも地上には続いていない。','駅名標には、あなたが一度だけ夢で読めた文字が書かれている。'],u:'駅を設置した。遠くで接近メロディが鳴った。電車は来なかった。',d:.9},
{n:'ガチャ',r:'UR',t:'装置 / 再帰',f:['中にガチャが入っている。そちらにも、これが入っている可能性がある。','排出テーブルを照会しています……照会しています……照会しています……','筐体の背面に「外側」と書かれた扉がある。'],u:'ガチャを使用した。無料で一回、何も出なかった。その「何も」がどこへ行ったのかは不明。',d:4},
{n:'このゲーム',r:'★★★★★',t:'ソフトウェア / 自己参照',f:['現在実行中です。にもかかわらず、ここにもあります。','容量：測定不能。最終更新：いま。','インベントリに入れた場合、あなたは何を見ていることになるのだろう。'],u:'このゲームを使用した。タイトルが一瞬だけ「あなた」に変わった。',d:20},
{n:'この世のすべて',r:'????????',t:'全体 / 排出不能',f:['当選、おめでとうございます。','カプセルの中に端末がある。端末の前にあなたがいる。そのカプセルを持っているあなたもいる。','残りの排出対象：0'],u:'すべてを開封した。\n\n世界から文章が消えかけた。端末は慌てて蓋を閉じた。\n\n「今回は見なかったことにします。」',d:49}
];
const weights={N:48,R:24,SR:14,SSR:8,UR:4,'★★★★★':1.5,'????????':.5};
let money=1000,integrity=100,found=new Set(),inventory=[],current=null,pulls=0;
const $=id=>document.getElementById(id); const fmt=n=>n.toLocaleString('ja-JP');
function log(s){let d=document.createElement('div');let now=new Date();d.innerHTML=`<span class="time">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</span>${s}`;$('log').prepend(d)}
function choose(){let pool=[];for(const x of items){let w=weights[x.r]||1; if(x.n==='この世のすべて'&&pulls<18)w=0;if(x.n==='このゲーム'&&pulls<10)w=.1;pool.push([x,w])}let total=pool.reduce((a,b)=>a+b[1],0),r=Math.random()*total;for(const [x,w] of pool){r-=w;if(r<=0)return x}return items[0]}
function update(){ $('money').textContent=fmt(money);$('found').textContent=found.size;$('integrity').textContent=Math.max(0,integrity).toFixed(3);$('pull').disabled=money<100; renderInv() }
function renderInv(){if(!inventory.length){$('inv').className='empty';$('inv').textContent='まだ何も所有していない。これはかなり珍しい状態です。';return}$('inv').className='';$('inv').innerHTML=inventory.map((x,i)=>`<div class="inv-item"><div class="inv-head"><span class="inv-name">${x.n}</span><span class="inv-meta">${x.r} // ${x.t}</span></div><div class="inv-flavor">${x.f[0]}</div></div>`).join('')}
function show(x){current=x;found.add(x.n);$('rarity').textContent=`${x.r} // NEW ACQUISITION`;$('name').textContent=x.n;$('type').textContent=x.t;$('flavor').textContent=x.f[Math.floor(Math.random()*x.f.length)];$('result').classList.add('show','blink');setTimeout(()=>$('result').classList.remove('blink'),900);log(`排出：［${x.r}］ ${x.n}`);update()}
$('pull').onclick=()=>{if(money<100)return;money-=100;pulls++;$('machineText').textContent=['内部で何かが選ばれています。','世界の在庫を照会しています。','存在を一件、こちら側へ移送しています。','抽選に倫理審査はありません。'][Math.floor(Math.random()*4)];$('result').classList.remove('show');setTimeout(()=>show(choose()),260)};
$('keep').onclick=()=>{if(!current)return;inventory.push(current);log(`「${current.n}」の所有権を主張しました。異議申立て：0件。`);current=null;$('result').classList.remove('show');update()};
$('discard').onclick=()=>{if(!current)return;log(`「${current.n}」を世界へ戻しました。世界は受領確認を送信しませんでした。`);current=null;$('result').classList.remove('show')};
$('use').onclick=()=>{if(!current)return;log(current.u);integrity-=current.d;$('worldText').innerHTML=`<strong>世界整合率 ${Math.max(0,integrity).toFixed(3)}%</strong><br>${current.u}<br><br>${integrity<80?'端末注記：世界は「だいたい同じ」なので、通常運用を継続します。':'端末注記：許容範囲内です。たぶん。'}`;if(current.n==='この世のすべて'){money+=100;log('補償として100円が返却されました。');}current=null;$('result').classList.remove('show');update()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active')});
update();
</script></main></body></html>
